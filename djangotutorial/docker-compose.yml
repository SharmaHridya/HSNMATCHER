version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hsn_db
    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    container_name: hsn_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
      - DB_HOST=db
      - OLLAMA_HOST=http://host.docker.internal:11434

    depends_on:
      - db

  frontend:
    build: ./frontend

    container_name: hsn_frontend

    command: npm run dev -- --host

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"
    env_file:
    - .env

    depends_on:
      - backend

volumes:
  postgres_data: